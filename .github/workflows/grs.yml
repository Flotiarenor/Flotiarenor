name: Update README cards

on:
  schedule:
    # 00:00 UTC = 北京时间 08:00。GitHub 的 cron 在高峰期可能延迟数十分钟。
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点击 Run workflow
  workflow_dispatch:

# 同一时间只跑一个，避免两次提交互相冲突
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # 必需：commit + push 生成的 SVG 要用到
      contents: write

    steps:
      - uses: actions/checkout@v6

      # ---------- Stats 卡片：浅色 / 深色各一份 ----------
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=light_github
          path: profile/stats-light.svg
          # 私有仓库统计 / 私有贡献需要 PAT，见说明；
          # 换成 ${{ secrets.GH_PAT }} 即可。
          token: ${{ secrets.GITHUB_TOKEN }}
          # 命中 GitHub API 速率限制时直接失败，而不是提交一张 "Something went wrong" 的错误图
          fail_on_error: "true"

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      # ---------- 常用语言卡片：浅色 / 深色各一份 ----------
      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=light_github
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark_github
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      # ---------- 固定某个仓库的 pin 卡片 ----------
      # 按需修改 repo，或直接删掉这两个 step
      # 注意：repo/gist 卡片用 *_repocard 主题，图标颜色才和 GitHub 一致
      - name: Generate pin card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=OmniBox&theme=light_github_repocard
          path: profile/pin-omnibox-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=OmniBox&theme=dark_github_repocard
          path: profile/pin-omnibox-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
