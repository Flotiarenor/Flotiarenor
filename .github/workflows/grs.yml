name: Update README cards

on:
  schedule:
    # 00:00 UTC = 北京时间 08:00。GitHub 的 cron 在高峰期可能延迟数十分钟。
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点击 Run workflow
  workflow_dispatch:

# 同一时间只跑一个，避免两次提交互相冲突
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # 必需：commit + push 生成的 SVG 要用到
      contents: write

    steps:
      - uses: actions/checkout@v6

      # ======================= 语言卡 =======================
      # 主页唯一的组件。浅色 / 深色各生成一份，README 里用 <picture> 按访客的
      # 系统主题自动切换 —— 渲染出来仍然只是一个组件。
      #
      # 参数逐条说明：
      #   layout=compact       紧凑横条，高度最小
      #   langs_count=8        显示 8 门语言；排除 CPython 后正好剩 8 种，不会截断
      #   size_weight=0.5      官方推荐算法，同时考虑代码字节数与仓库数量
      #   count_weight=0.5
      #   hide_title=true      不要 "Most Used Languages" 标题行（想显示就删掉这段）
      #   hide_border=true     去掉描边
      #   locale=en            注意：本项目新增统计项的翻译键大多只有 en，
      #                        改成 cn / zh-tw 有渲染成 "Something went wrong" 的风险
      #
      # exclude_repo=Python-3.10.13  ← 关键参数
      #   这个仓库是 CPython 源码副本（368 MB，是你其余所有仓库总和的 24 倍，
      #   Python 56.7% + C 41.3%）。不排除的话它会独占整张语言卡，把
      #   JavaScript / Vue / CSS / TypeScript 这些你自己写的代码全部压掉。
      #   如果哪天想把它算进来又不想被它带偏，可以把上面两行权重改成
      #   size_weight=0&count_weight=1（纯按仓库数量排序，字节数不再影响结果）。
      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&exclude_repo=Python-3.10.13&hide_title=true&hide_border=true&locale=en&theme=light_github"
          path: profile/top-langs-light.svg
          # 私有仓库的语言统计需要 PAT，换成 ${{ secrets.GH_PAT }} 即可
          token: ${{ secrets.GITHUB_TOKEN }}
          # 命中 GitHub API 速率限制时直接失败，而不是提交一张 "Something went wrong" 的错误图
          fail_on_error: "true"

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # 与浅色版逐字相同，只把结尾的 theme 换成 dark_github
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&exclude_repo=Python-3.10.13&hide_title=true&hide_border=true&locale=en&theme=dark_github"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
